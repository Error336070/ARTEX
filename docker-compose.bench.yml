# ARTEX Tencent TSec Benchmark evaluation image: local build and run.
# Independent of production docker-compose.yml (multiple services: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # Set LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in foreground (view logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # Background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to also delete volumes)
# Browser: http://localhost:8787 (sign in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share host networking: the container uses the host network stack and can reach the host/VPN target network directly.
    # Host mode needs no ports mapping; the container binds host ports directly: 8787 (UI/API), 8788 (proxy),
    # and internal PostgreSQL 5432. Ensure these three host ports are free (stop services using them before local testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
